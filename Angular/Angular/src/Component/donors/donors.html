<div class="card p-5 shadow-3 border-round-xl bg-white max-w-full mx-auto" style="max-width: 1100px;">
    <h2 class="mb-5 text-3xl font-bold text-primary text-center">ניהול תורמים</h2>

    <div class="flex flex-wrap gap-4 mb-5 p-4 bg-gray-100 border-round-lg shadow-1 align-items-end justify-content-between">
        
        <div class="flex flex-column gap-2 min-w-16rem">
            <span class="p-input-icon-left">
                <i class="pi pi-user"></i>
                <input pInputText type="text" [(ngModel)]="firstName" placeholder="שם פרטי" class="p-inputtext-sm w-full">
            </span>
            <input pInputText type="text" [(ngModel)]="lastName" placeholder="שם משפחה" class="p-inputtext-sm w-full">
            <button pButton label="חפש לפי שם" icon="pi pi-search" (click)="searchByName(firstName, lastName)" class="p-button-sm w-full"></button>
        </div>

        <div class="border-left-1 border-gray-300 mx-3 h-7rem hidden md:block"></div>

        <div class="flex flex-column gap-2 min-w-16rem">
            <span class="p-input-icon-left">
                <i class="pi pi-envelope"></i>
                <input pInputText type="text" #emailSearch placeholder="אימייל" class="p-inputtext-sm w-full">
            </span>
            <button pButton label="חפש אימייל" icon="pi pi-at" (click)="searchByEmail(emailSearch.value)" class="p-button-sm p-button-info w-full"></button>
        </div>

        <div class="border-left-1 border-gray-300 mx-3 h-7rem hidden md:block"></div>

        <div class="flex flex-column gap-2 min-w-16rem">
            <span class="p-input-icon-left">
                <i class="pi pi-gift"></i>
                <input pInputText type="text" #giftSearch placeholder="שם מתנה" class="p-inputtext-sm w-full">
            </span>
            <button pButton label="חפש מתנה" icon="pi pi-search" (click)="searchByGift(giftSearch.value)" class="p-button-sm p-button-help w-full"></button>
        </div>

        <div class="flex flex-column gap-2 min-w-12rem">
            <button pButton label="הוספת תורם" icon="pi pi-plus" (click)="resetForm(); displayModal = true" class="p-button-sm p-button-success w-full"></button>
            <button pButton icon="pi pi-refresh" label="נקה הכל" (click)="getAllDonors(); resetForm()" class="p-button-sm p-button-secondary p-button-outlined w-full"></button>
        </div>
    </div>

    <p-table [value]="sourceDonors()" [paginator]="true" [rows]="10"
             [tableStyle]="{ 'min-width': '50rem' }"
             styleClass="p-datatable-striped p-datatable-gridlines border-round-lg shadow-1">
        <ng-template pTemplate="header">
            <tr>
                <th>מזהה</th>
                <th>שם פרטי</th>
                <th>שם משפחה</th>
                <th>אימייל</th>
                <th>טלפון</th>
                <th style="width: 10rem">פעולות</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-donor>
            <tr>
                <td>{{ donor.id || donor.Id }}</td>
                <td>{{ donor.firstName || donor.FirstName }}</td>
                <td>{{ donor.lastName || donor.LastName }}</td>
                <td>{{ donor.email || donor.Email }}</td>
                <td>{{ donor.phone || donor.Phone }}</td>
                <td class="flex gap-2 justify-content-center">
                    <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-warning" (click)="editDonor(donor)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger" (click)="deleteDonor(donor)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-4">לא נמצאו תורמים העונים לחיפוש.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [header]="id === 0 ? 'הוספת תורם חדש' : 'עדכון פרטי תורם'" [(visible)]="displayModal" [modal]="true" [style]="{ width: '25vw' }" [draggable]="false" [resizable]="false" class="p-fluid">
    <div class="flex flex-column gap-3 mt-2">
        <div class="flex flex-column gap-1">
            <label for="fname">שם פרטי</label>
            <input pInputText id="fname" [(ngModel)]="firstName" name="firstName" />
        </div>
        <div class="flex flex-column gap-1">
            <label for="lname">שם משפחה</label>
            <input pInputText id="lname" [(ngModel)]="lastName" name="lastName" />
        </div>
        <div class="flex flex-column gap-1">
            <label for="mail">אימייל</label>
            <input pInputText id="mail" [(ngModel)]="email" name="email" />
        </div>
        <div class="flex flex-column gap-1">
            <label for="phn">טלפון</label>
            <input pInputText id="phn" [(ngModel)]="phone" name="phone" />
        </div>
    </div>
    <ng-template pTemplate="footer">
        <button pButton label="ביטול" icon="pi pi-times" (click)="displayModal=false" class="p-button-text"></button>
        <button pButton [label]="id === 0 ? 'צור תורם' : 'שמור שינויים'" 
                icon="pi pi-check" 
                (click)="id === 0 ? craeteDonor() : updateDonor()">
        </button>
    </ng-template>
</p-dialog>
